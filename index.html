<style>
  :root{
    --ink:#1A2332; --ink-2:#4A5568; --ink-3:#8A94A6;
    --line:#E6E9EF; --line-soft:#F0F2F6;
    --bg:#FFFFFF; --bg-soft:#F7F8FA;
    --blue:#1F4E79; --blue-soft:#EAF1F8;
    --red:#9C2B2B; --red-soft:#F7ECEC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);font-family:"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1120px;margin:0 auto;padding:38px 40px 32px;}

  /* 页眉：只保留一句话观点 */
  h1{font-size:24px;font-weight:700;line-height:1.4;max-width:820px;}
  h1 .hl{color:var(--blue);}
  h1 .hl-red{color:var(--red);}
  .meta{margin-top:10px;font-size:12px;color:var(--ink-3);line-height:1.6;}

  /* 双区：左右结构；激活区放大，非激活区退到后方缩小停滞 */
  .boards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px;align-items:stretch;}
  .board{
    border:1px solid var(--line);border-radius:12px;background:var(--bg-soft);
    transition:transform .28s ease,box-shadow .28s ease,opacity .28s ease,border-color .28s ease;
    transform:scale(.92);opacity:.72;
  }
  .board.active{transform:scale(1);opacity:1;box-shadow:0 16px 38px rgba(26,35,50,.13);}
  .board.base.active{border-color:var(--blue);}
  .board.scene.active{border-color:var(--red);}

  .board-head{display:flex;align-items:baseline;gap:10px;padding:18px 22px 0;}
  .board-head .tag{font-size:11px;font-weight:700;color:#fff;border-radius:3px;padding:2px 9px;}
  .board.base .board-head .tag{background:var(--blue);}
  .board.scene .board-head .tag{background:var(--red);}
  .board-head h2{font-size:14px;font-weight:700;}
  .board-head .count{font-size:11px;color:var(--ink-3);}
  .board-head .state{margin-left:auto;font-size:10px;color:var(--ink-3);}

  .stage{position:relative;min-height:268px;overflow:hidden;}
  .slide{position:absolute;inset:0;padding:14px 22px;opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .28s ease,transform .28s ease,visibility .28s ease;}
  .slide.cur{opacity:1;visibility:visible;transform:translateX(0);}
  .card-who{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.5px;margin-bottom:6px;}
  .card-name{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:4px;}
  .card-mini{display:inline-block;font-size:10.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 9px;margin:6px 0 12px;}
  .card ul{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .card li{font-size:12.5px;line-height:1.55;color:var(--ink-2);padding-left:13px;position:relative;}
  .card li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
  .board.scene .card li::before{background:var(--red);}
  .card li b{color:var(--ink);}
  .card .src{margin-top:12px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:10px;color:var(--ink-3);}
  .card .weak{color:var(--red);}

  .board-nav{display:flex;align-items:center;gap:12px;padding:0 22px 16px;}
  .nav{width:32px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);transition:border-color .2s ease,color .2s ease;}
  .nav:hover{border-color:var(--blue);color:var(--blue);}
  .board.scene .nav:hover{border-color:var(--red);color:var(--red);}
  .nav svg{width:15px;height:15px;}
  .dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .dots button{width:8px;height:8px;border-radius:50%;border:none;background:#D7DCE4;cursor:pointer;padding:0;transition:background .2s ease,transform .2s ease;}
  .dots button.active{background:var(--blue);transform:scale(1.3);}
  .board.scene .dots button.active{background:var(--red);}
  .board-count{margin-left:auto;font-size:11px;color:var(--ink-3);}

  /* 底部口径 */
  .footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:20px;font-size:10.5px;color:var(--ink-3);line-height:1.6;}

  @media (max-width:860px){
    .boards{grid-template-columns:1fr;}
    .board{transform:scale(1);opacity:1;}
  }
  @media (max-width:720px){
    .wrap{padding:26px 18px;}
    .slide{padding:16px 18px;}
    .card-name{font-size:16px;}
    .footer{flex-direction:column;gap:6px;}
  }
  @media (prefers-reduced-motion:reduce){.board,.slide,.nav,.dots button{transition:none;}}
</style>

    var stage = document.querySelector('[data-stage="' + cat + '"]');
    var dots = document.querySelector('[data-dots="' + cat + '"]');
    var counter = document.querySelector('[data-counter="' + cat + '"]');
    var stateLabel = document.getElementById("state-" + cat);

    function render(){
      state.idx = Math.min(state.idx, list.length - 1);
      stage.innerHTML = list.map(function(d, i){
        var cls = i === state.idx ? "slide cur" : "slide";
        return '<div class="' + cls + '">' + slideHTML(d) + '</div>';
      }).join("");
      dots.innerHTML = list.map(function(_, i){
        return '<button data-i="' + i + '" class="' + (i === state.idx ? "active" : "") + '" aria-label="第 ' + (i+1) + ' 款"></button>';
      }).join("");
      counter.textContent = (state.idx + 1) + " / " + list.length;
      document.getElementById("count-" + cat).textContent = list.length + " 款";
    }
    function go(i){
      state.idx = (i + list.length) % list.length;
      render();
    }
    function startAuto(){
      stopAuto();
      if(!reduceMotion){ state.timer = setInterval(function(){ go(state.idx + 1); }, INTERVAL); }
    }
    function stopAuto(){ if(state.timer){ clearInterval(state.timer); state.timer = null; } }

    document.querySelector('[data-prev="' + cat + '"]').addEventListener("click", function(e){ e.stopPropagation(); go(state.idx - 1); });
    document.querySelector('[data-next="' + cat + '"]').addEventListener("click", function(e){ e.stopPropagation(); go(state.idx + 1); });
    dots.addEventListener("click", function(e){
      var b = e.target.closest("button[data-i]");
      if(b){ e.stopPropagation(); go(Number(b.dataset.i)); }
    });

    /* 点击该区域：将其设为激活放大并自动播放，另一区域退回后方停滞 */
    board.addEventListener("click", function(){
      if(activeCat === cat){ return; }
      activeCat = cat;
      syncActive();
    });

    render();
    return {cat:cat, go:go, startAuto:startAuto, stopAuto:stopAuto, board:board, stateLabel:stateLabel};
  }

  var boards = {base:createBoard("base"), scene:createBoard("scene")};

  function syncActive(){
    Object.keys(boards).forEach(function(c){
      var b = boards[c];
      var isActive = c === activeCat;
      b.board.classList.toggle("active", isActive);
      b.stateLabel.textContent = isActive ? "播放中" : "已暂停";
      if(isActive){ b.startAuto(); } else { b.stopAuto(); }
    });
  }

  syncActive();
</script>
</body>
</html>
